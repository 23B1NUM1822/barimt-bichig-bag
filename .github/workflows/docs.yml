# Definition of Done checks for every documentation change (docs/definition-of-done.md).
name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install spellchecker
        run: pip install codespell==2.4.3
      - name: DoD 1-3, document rules
        run: python scripts/check_dod.py
      - name: DoD 3, valid Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"
      - name: DoD 3, spelling
        run: codespell
